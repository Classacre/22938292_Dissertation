# Use the cluster-generic executor (Snakemake ≥ 8).
executor: cluster-generic

# Submit command for SLURM. --parsable makes sbatch print the jobid.
cluster-generic-submit-cmd: "sbatch --parsable --export=ALL --job-name=smk_{rule} --partition=work --cpus-per-task={threads} --mem={resources.mem_mb}M --time={resources.time} --mail-type=FAIL --mail-user=22938292@student.uwa.edu.au --output=logs/{rule}.out --error=logs/{rule}.err {jobscript}"

# Cancel a job.
cluster-generic-cancel-cmd: "scancel {jobid}"

# Determine job status. Uses sacct primarily, with squeue fallback.
cluster-generic-status-cmd: "bash -lc 'jid={jobid}; state=$(sacct -j $jid --format=State --noheader 2>/dev/null | head -n1 | awk \"{print $1}\"); if [ -z \"$state\" ]; then if squeue -j $jid 1>/dev/null 2>&1; then echo running; else echo unknown; fi; elif [[ \"$state\" =~ ^(COMPLETED)$ ]]; then echo success; elif [[ \"$state\" =~ ^(RUNNING|PENDING|CONFIGURING|COMPLETING)$ ]]; then echo running; else echo failed; fi'"

# Make sure a conda CLI is available inside worker jobs (for conda run).
precommand: "source /etc/profile.d/modules.sh; module load Anaconda3/2024.06 || true"

# --- Conda Settings ---
use-conda: true
conda-prefix: "/group/sms029/mnieuwenh/workflow2/.snakemake/conda"

# --- Job Execution Settings ---
default-resources:
  - mem_mb=16000
  - "time=04:00:00"
jobs: 100
latency-wait: 120
restart-times: 1

# --- Workflow Behavior ---
printshellcmds: true
keep-going: true